<svg width="2560" height="1440" viewBox="0 0 2560 1440" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bbg" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1a1f38"/>
      <stop offset="60%" stop-color="#0b0d17"/>
      <stop offset="100%" stop-color="#070811"/>
    </radialGradient>
    <linearGradient id="bring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="35%" stop-color="#00B894"/>
      <stop offset="70%" stop-color="#E17055"/>
      <stop offset="100%" stop-color="#0984E3"/>
