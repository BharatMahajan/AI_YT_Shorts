    <circle cx="160" cy="160" r="120" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="20"/>
    <path d="M128 92 L128 228 L246 160 Z" fill="#ffffff"/>
  </g>

  <!-- wordmark -->
  <text x="1010" y="700" font-family="Poppins, Arial, sans-serif" font-size="150" font-weight="800"
