  </defs>

  <rect width="2560" height="1440" fill="url(#bbg)"/>

  <!-- glow blobs -->
  <circle cx="600" cy="300" r="420" fill="#6C5CE7" opacity="0.16"/>
  <circle cx="2000" cy="1150" r="460" fill="#0984E3" opacity="0.14"/>
  <circle cx="2150" cy="250" r="300" fill="#E17055" opacity="0.10"/>

  <!-- grid -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="2">
    <path d="M0 360H2560 M0 720H2560 M0 1080H2560"/>
    <path d="M640 0V1440 M1280 0V1440 M1920 0V1440"/>
  </g>

  <!-- ===== SAFE AREA (center 1546x423 ≈ x:507-2053, y:508-931) ===== -->

  <!-- logo mark left of title -->
  <g transform="translate(700,560)">
    <circle cx="160" cy="160" r="120" fill="none" stroke="url(#bring)" stroke-width="20" stroke-linecap="round"
