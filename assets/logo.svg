<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6C5CE7"/>
      <stop offset="35%" stop-color="#00B894"/>
      <stop offset="70%" stop-color="#E17055"/>
      <stop offset="100%" stop-color="#0984E3"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#161a2e"/>
      <stop offset="100%" stop-color="#0b0d17"/>
    </radialGradient>
  </defs>

  <!-- rounded square base -->
  <rect x="0" y="0" width="800" height="800" rx="180" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="2">
    <path d="M0 200H800 M0 400H800 M0 600H800 M200 0V800 M400 0V800 M600 0V800"/>
  </g>

  <!-- multi-color minute ring (clock = 'minute') -->
  <circle cx="400" cy="400" r="250" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round"
          stroke-dasharray="1180 1571" transform="rotate(-90 400 400)"/>
  <circle cx="400" cy="400" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="34"/>

  <!-- play triangle (Shorts) -->
  <path d="M345 300 L345 500 L520 400 Z" fill="#ffffff"/>

  <!-- AI wordmark -->
  <text x="400" y="640" text-anchor="middle" font-family="Poppins, Arial, sans-serif"
        font-size="120" font-weight="800" fill="#ffffff" letter-spacing="4">AI</text>
</svg>
